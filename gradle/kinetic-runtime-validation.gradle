// Explicit test fixture; never included in release artifacts. Forge 1.20.1 reads META-INF/mods.toml, NeoForge
// META-INF/neoforge.mods.toml.
{
    def forge = project.property('loader') == 'forge'
    def metadata = layout.buildDirectory.dir('runtime-validation')
    def writeMetadata = tasks.register('writeRuntimeValidationMetadata') {
        outputs.dir metadata
        doLast {
            File target = new File(metadata.get().asFile, forge ? 'META-INF/mods.toml' : 'META-INF/neoforge.mods.toml')
            target.parentFile.mkdirs()
            target.setText('modLoader="javafml"\nloaderVersion="' + (forge ? '[47,)' : '[1,)') + '"\nlicense="LGPLv3"\n[[mods]]\nmodId="contentstudio_validation"\nversion="1.0.0"\ndisplayName="ContentStudio runtime validation"\n', 'UTF-8')
            // Forge 1.20.1 shows a blocking warning screen for a mod jar without pack metadata.
            if (forge) new File(metadata.get().asFile, 'pack.mcmeta').setText('{"pack":{"description":"ContentStudio runtime validation","pack_format":15}}', 'UTF-8')
        }
    }
    tasks.register('runtimeValidationJar', Jar) {
        dependsOn 'testClasses', writeMetadata
        from(sourceSets.test.output) { include 'dev/xyat/contentstudiovalidation/*.class' }
        from({ configurations.testRuntimeClasspath.files.findAll { it.name.startsWith('junit-') || it.name.startsWith('opentest4j-') || it.name.startsWith('apiguardian-') }.collect { zipTree(it) } }) { exclude 'META-INF/**', 'module-info.class' }
        from metadata
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        archiveFileName = 'contentstudio-validation.jar'
    }
}
